<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087b89"><link rel="manifest" href="manifest.json"><title>Organizer</title><style>body{margin:0;font-family:system-ui;background:linear-gradient(140deg,#f0fafb,#fff);color:#17344b}main{max-width:650px;margin:auto;padding:24px}h1{font-size:32px}button,input,textarea,select{font:inherit}button{border:0;border-radius:17px;padding:17px;cursor:pointer} .primary{color:white;background:linear-gradient(110deg,#0862bd,#08a78a)}.secondary{color:white;background:linear-gradient(110deg,#087b89,#1d6cbb)}.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.menu button{padding:15px 5px}.create{display:grid;gap:12px;margin:35px 0 18px}.panel{background:white;border-radius:20px;padding:17px;margin-top:18px;box-shadow:0 8px 28px #124b6b12}.item{background:#f3f9fb;border-radius:15px;padding:14px;margin:10px 0}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.field{display:block;width:100%;box-sizing:border-box;margin:9px 0;padding:12px;border:1px solid #ccdce3;border-radius:12px}textarea{min-height:90px}small{color:#527080}img.photo{max-width:100%;max-height:220px;border-radius:12px} .hidden{display:none} .muted{background:#e8f2f5;color:#17344b} .danger{color:#a13232}.form-actions{margin-top:24px;gap:14px}.photo-picker{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0;padding:16px;border:1px solid #8dcbd1;border-radius:16px;background:linear-gradient(110deg,#e7f7fa,#e8f8ee);color:#145d72;font-weight:650;cursor:pointer}.photo-picker svg{width:23px;height:23px}.photo-picker input{display:none}.settings-home{margin-top:55px}.settings-home summary{cursor:pointer}.photo-status{display:block;margin-top:-8px;margin-bottom:14px} @media(max-width:390px){main{padding:14px}.menu{gap:5px}.menu button{font-size:13px}}</style></head><body><main><header class="row"><h1>✎ Organizer</h1><button class="muted" onclick="show('home')">Início</button></header><section id="home"><div class="create"><button class="primary" onclick="editTask()">＋ Nova tarefa</button><button class="secondary" onclick="editNote()">＋ Nova nota</button></div><div class="menu"><button class="muted" onclick="show('tasks')">Tarefas</button><button class="muted" onclick="show('calendar')">Calendário</button><button class="muted" onclick="show('notes')">Notas</button></div><section class="panel settings-home"><details><summary>Definições e cópia de segurança</summary><p><button class="muted" onclick="backup()">Exportar dados</button> <label>Importar dados <input type="file" accept="application/json" onchange="restore(event)"></label></p><small>Os dados ficam neste dispositivo/navegador. Guarda cópias de segurança regularmente. A voz pode necessitar de internet.</small></details></section></section><section id="tasks" class="panel hidden"><h2>Tarefas pendentes</h2><div id="taskList"></div></section><section id="calendar" class="panel hidden"><h2>Por data</h2><div id="calendarList"></div></section><section id="notes" class="panel hidden"><h2>Notas</h2><div id="noteList"></div></section><section id="taskForm" class="panel hidden"><h2>Tarefa</h2><input id="taskTitle" class="field" placeholder="Título"><button class="muted" onclick="dictate('taskTitle')">🎙 Ditar título</button><select id="taskArea" class="field"><option>Pessoal</option><option>Profissional</option></select><select id="taskPriority" class="field"><option value="2">Média</option><option value="1">Alta</option><option value="3">Baixa</option></select><label>Data (opcional)<input id="taskDate" type="date" class="field"></label><textarea id="taskDetails" class="field" placeholder="Observações"></textarea><button class="muted" onclick="dictate('taskDetails')">🎙 Ditar observações</button><div class="row form-actions"><button class="primary" onclick="saveTask()">Guardar</button><button class="muted" onclick="show('home')">Cancelar</button></div></section><section id="noteForm" class="panel hidden"><h2>Nota</h2><input id="noteTitle" class="field" placeholder="Título"><button class="muted" onclick="dictate('noteTitle')">🎙 Ditar título</button><textarea id="noteText" class="field" placeholder="Descrição"></textarea><button class="muted" onclick="dictate('noteText')">🎙 Ditar descrição</button><label class="photo-picker"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4H9l-2 3H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-3-3Z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Registo fotográfico</span><input id="noteImage" type="file" accept="image/*" capture="environment" onchange="document.getElementById('photoStatus').textContent=this.files[0]?.name||''"></label><small id="photoStatus" class="photo-status"></small><div class="row form-actions"><button class="primary" onclick="saveNote()">Guardar</button><button class="muted" onclick="show('home')">Cancelar</button></div></section></main><script src="app.js"></script></body></html>
